name: Daily data update + Pages deploy
# NOTA (transição Cloudflare): este workflow continua publicando no GitHub Pages.
# Em paralelo, a Cloudflare Pages reconstrói do mesmo push (deploy independente).
# O commit de docs/data/data.json serve aos dois: site do Pages + base do merge da Function.
# Desligar o GitHub Pages é passo manual/opcional pós-validação (ver DEPLOY-CLOUDFLARE.md).

on:
  schedule:
    # 06:00 BRT (UTC-3) = 09:00 UTC
    - cron: '0 9 * * *'
  push:
    branches: [main]
    # O commit diário de dados NÃO deve re-disparar este workflow (evita loop).
    # Substitui o antigo "[skip ci]" na mensagem — que também fazia o Cloudflare
    # Pages pular o deploy, deixando o snapshot estático congelado.
    paths-ignore:
      - 'docs/data/data.json'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci || npm install

      - name: Extract data from Google Sheet + Meta Ads
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: node scripts/extract.js

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/data/data.json; then
            git add docs/data/data.json
            # Sem "[skip ci]": o Cloudflare Pages honra essa marca e pularia o
            # deploy. O loop do workflow é evitado pelo paths-ignore no push (topo).
            git commit -m "chore(data): atualiza dados"
            git push
          else
            echo "Sem mudanças em data.json."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
