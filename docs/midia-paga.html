<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      var AUTH_KEY = "vesti.auth.ok";
      var TTL = 1000 * 60 * 60 * 8;
      try {
        var raw = sessionStorage.getItem(AUTH_KEY);
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.ts && Date.now() - data.ts < TTL) return;
        }
      } catch (e) { /* ignore */ }
      window.location.replace("login.html");
    })();
  </script>
  <title>Vesti · Mídia Paga</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-pink':   '#6A52B3',
            'brand-purple': '#63C19B',
            'brand-peach':  '#549E86',
          },
          fontFamily: {
            sans: ['-apple-system','BlinkMacSystemFont','"Segoe UI"','Roboto','"Helvetica Neue"','Arial','sans-serif'],
          },
        }
      }
    }
  </script>

  <style>
    html, body { background: #f7f4fb; color: #1a1635; }
    body {
      background:
        radial-gradient(ellipse at top left, #e9def5 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, #dff0e8 0%, transparent 55%),
        #f7f4fb;
      min-height: 100vh;
    }
    .bg-grid {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(43,12,85,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(43,12,85,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
      -webkit-mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
      pointer-events: none; z-index: 0;
    }
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); opacity: 0.28; pointer-events: none; z-index: 0;
      animation: drift 18s ease-in-out infinite;
    }
    .orb-1 { width:420px; height:420px; background: radial-gradient(circle,#6A52B3 0%,transparent 70%); top:-120px; left:-80px; }
    .orb-2 { width:520px; height:520px; background: radial-gradient(circle,#63C19B 0%,transparent 70%); bottom:-160px; right:-120px; animation-delay:-6s; }
    @keyframes drift { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-20px) scale(1.08); } }

    .card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      border: 1px solid rgba(43,12,85,0.08);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(43,12,85,0.08), inset 0 1px 0 rgba(255,255,255,0.9);
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(43,12,85,0.14); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(43,12,85,0.26); }
  </style>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body class="font-sans antialiased overflow-x-hidden">
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div id="root" class="relative z-10"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    const AUTH_KEY = "vesti.auth.ok";
    const SQL_PERFIS = new Set(["Pro", "Starter", "Qualificado (Sem Faixa)"]);
    const MESES_LONG = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    const fmtNumber = (n) => (n == null ? "—" : new Intl.NumberFormat("pt-BR").format(n));
    const fmtPct = (n) => (n == null || !isFinite(n) ? "—" : `${n.toFixed(1).replace(".", ",")}%`);

    // dd/mm/aaaa hh:mm:ss  → "YYYY-MM" ou null
    function leadMonthKey(str) {
      const m = String(str || "").match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      return m ? `${m[3]}-${m[2]}` : null;
    }

    function applyFilters(leads, { years, months, criativos, anuncios } = {}) {
      return leads.filter(l => {
        const k = leadMonthKey(l.data);
        const [ky, km] = k ? k.split("-") : [null, null];
        if (years && years.size > 0 && (!ky || !years.has(ky))) return false;
        if (months && months.size > 0 && (!km || !months.has(km))) return false;
        if (criativos && criativos.size > 0 && !criativos.has(l.criativo)) return false;
        if (anuncios && anuncios.size > 0 && !anuncios.has(l.anuncio)) return false;
        return true;
      });
    }

    function aggregate(leads) {
      const byCriativo = new Map();
      let total = 0, sql = 0, semCriativo = 0;
      for (const l of leads) {
        total++;
        const isSql = SQL_PERFIS.has(l.perfil);
        if (isSql) sql++;
        if (!l.criativo) { semCriativo++; continue; }
        if (!byCriativo.has(l.criativo)) byCriativo.set(l.criativo, { name: l.criativo, total: 0, sql: 0 });
        const e = byCriativo.get(l.criativo);
        e.total++;
        if (isSql) e.sql++;
      }
      const criativos = [...byCriativo.values()]
        .map(e => ({ ...e, sql_pct: e.total ? +(100 * e.sql / e.total).toFixed(2) : 0 }))
        .sort((a, b) => b.total - a.total);
      return {
        total,
        total_sql: sql,
        sql_pct: total ? +(100 * sql / total).toFixed(2) : 0,
        sem_criativo: semCriativo,
        pct_sem_criativo: total ? +(100 * semCriativo / total).toFixed(2) : 0,
        criativos,
      };
    }

    function Header() {
      const logout = () => {
        try { sessionStorage.removeItem(AUTH_KEY); } catch (_) {}
        window.location.replace("login.html");
      };
      return (
        <header className="flex items-center justify-between px-6 lg:px-10 py-5 border-b border-[#2B0C55]/10 backdrop-blur-sm">
          <div className="flex items-center gap-3">
            <span className="relative inline-grid place-items-center w-9 h-9">
              <span className="w-4 h-4 rounded-full"
                    style={{ background: "linear-gradient(135deg,#6A52B3,#63C19B)",
                             boxShadow: "0 0 22px rgba(106,82,179,.55), 0 0 40px rgba(99,193,155,.4)" }} />
            </span>
            <div className="flex flex-col leading-tight">
              <span className="text-[17px] font-bold tracking-wide"
                    style={{ background:"linear-gradient(120deg,#2B0C55 0%,#6A52B3 60%,#549E86 100%)",
                             WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" }}>
                Vesti
              </span>
              <span className="text-[10.5px] uppercase tracking-[1.6px] text-slate-500">Mídia Paga · Performance</span>
            </div>
          </div>

          <div className="flex items-center gap-3">
            <a href="index.html"
               className="inline-flex items-center gap-1.5 text-xs text-slate-700 border border-[#2B0C55]/10 rounded-lg px-3 py-2 hover:text-slate-900 hover:border-brand-pink hover:bg-brand-pink/10 transition"
               title="Voltar ao dashboard">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <path d="M12 5l-5 5 5 5" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Dashboard
            </a>
            <a href="meta.html"
               className="relative inline-flex items-center gap-1.5 text-xs font-semibold text-white rounded-lg px-3.5 py-2 shadow-[0_8px_20px_rgba(106,82,179,.35)] hover:shadow-[0_10px_26px_rgba(106,82,179,.5)] hover:-translate-y-0.5 transition"
               style={{ background: "linear-gradient(120deg,#6A52B3 0%,#8A6DD1 55%,#63C19B 100%)" }}
               title="Ver metas mensais e trimestrais">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" strokeWidth="1.8"/>
                <circle cx="10" cy="10" r="3.5" fill="none" stroke="currentColor" strokeWidth="1.8"/>
                <circle cx="10" cy="10" r="1" fill="currentColor"/>
              </svg>
              Comparação com metas
            </a>
            <button onClick={logout}
              className="inline-flex items-center gap-1.5 text-xs text-slate-700 border border-[#2B0C55]/10 rounded-lg px-3 py-2 hover:text-slate-900 hover:border-brand-pink hover:bg-brand-pink/10 transition"
              title="Encerrar sessão">
              <svg viewBox="0 0 20 20" width="14" height="14">
                <path d="M12 4H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h7M9 10h8m0 0-3-3m3 3-3 3"
                      fill="none" stroke="currentColor" strokeWidth="1.8"
                      strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Sair
            </button>
          </div>
        </header>
      );
    }

    function KpiCard({ label, value, sub, accent }) {
      return (
        <div className="card p-5">
          <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500">{label}</div>
          <div className="mt-1 text-3xl font-semibold tabular-nums"
               style={accent ? { background: "linear-gradient(120deg,#6A52B3 0%,#63C19B 100%)",
                                 WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" } : {}}>
            {value}
          </div>
          {sub && <div className="mt-1 text-xs text-slate-500">{sub}</div>}
        </div>
      );
    }

    function HighlightKpi({ label, value, sub }) {
      return (
        <div className="card p-5 relative overflow-hidden">
          <div className="absolute inset-0 pointer-events-none"
               style={{ background: "linear-gradient(135deg, rgba(106,82,179,0.08) 0%, rgba(99,193,155,0.06) 100%)" }} />
          <div className="absolute left-0 top-0 bottom-0 w-1 rounded-l-2xl"
               style={{ background: "linear-gradient(180deg,#6A52B3 0%,#63C19B 100%)" }} />
          <div className="relative">
            <div className="text-[11px] uppercase tracking-[1.4px] text-slate-500">{label}</div>
            <div className="mt-1 text-4xl font-bold tabular-nums"
                 style={{ background: "linear-gradient(120deg,#2B0C55 0%,#6A52B3 60%,#549E86 100%)",
                          WebkitBackgroundClip: "text", backgroundClip: "text", color: "transparent" }}>
              {value}
            </div>
            {sub && <div className="mt-1 text-xs text-slate-500">{sub}</div>}
          </div>
        </div>
      );
    }

    // Cor da barra cresce de vermelho (ruim) → âmbar → roxo → verde (ótimo) conforme a taxa SQL aumenta.
    function rateColor(pct) {
      if (pct == null || pct <= 0) return "#fb7185";   // rose-400  (0%: nenhum SQL)
      if (pct < 5)   return "#fb7185";                  // rose-400  (< 5%)
      if (pct < 10)  return "#fbbf24";                  // amber-400 (5–10%)
      if (pct < 20)  return "#a78bfa";                  // violet-400 (10–20%, neutro/brand)
      if (pct < 30)  return "#34d399";                  // emerald-400 (20–30%, bom)
      return "#059669";                                  // emerald-600 (≥ 30%, ótimo)
    }

    function RateBar({ pct }) {
      const w = Math.max(0, Math.min(100, pct || 0));
      const color = rateColor(pct);
      return (
        <div className="flex items-center gap-3">
          <div className="flex-1 h-2 rounded-full bg-[#2B0C55]/8 overflow-hidden">
            <div className="h-full rounded-full transition-[width,background-color] duration-300"
                 style={{ width: `${w}%`, background: color }} />
          </div>
          <span className="text-xs tabular-nums w-14 text-right font-semibold" style={{ color }}>
            {fmtPct(pct)}
          </span>
        </div>
      );
    }

    function CriativosTable({ rows }) {
      if (!rows.length) {
        return (
          <div className="px-6 py-10 text-center text-sm text-slate-400">
            Nenhum criativo identificado para esta origem.
          </div>
        );
      }
      return (
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-[11px] uppercase tracking-[1.4px] text-slate-500 border-b border-[#2B0C55]/8">
                <th className="text-left px-6 py-3 font-medium">Criativo</th>
                <th className="text-right px-6 py-3 font-medium">Leads</th>
                <th className="text-right px-6 py-3 font-medium">SQL</th>
                <th className="text-left px-6 py-3 font-medium w-2/5">Taxa SQL</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((c, i) => (
                <tr key={c.name} className={i % 2 ? "bg-white/40" : "bg-transparent"}>
                  <td className="px-6 py-3 font-medium text-slate-800">{c.name}</td>
                  <td className="px-6 py-3 text-right tabular-nums">{fmtNumber(c.total)}</td>
                  <td className="px-6 py-3 text-right tabular-nums">{fmtNumber(c.sql)}</td>
                  <td className="px-6 py-3"><RateBar pct={c.sql_pct} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    const SELECT_CLS = "bg-white/80 border border-[#2B0C55]/10 rounded-lg px-3 py-2 text-sm text-slate-800 focus:outline-none focus:border-brand-pink";

    function MultiSelectDropdown({ allLabel, pluralLabel, options, selected, onChange, displayFn, minWidth = 180, popoverWidth = "w-64" }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => {
        const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener("mousedown", onClick);
        return () => document.removeEventListener("mousedown", onClick);
      }, []);

      const display = displayFn || ((v) => v);
      const label = selected.size === 0
        ? allLabel
        : selected.size === 1
          ? display([...selected][0])
          : `${selected.size} ${pluralLabel}`;

      const toggle = (v) => {
        const next = new Set(selected);
        if (next.has(v)) next.delete(v); else next.add(v);
        onChange(next);
      };

      return (
        <div ref={ref} className="relative">
          <button type="button" onClick={() => setOpen(o => !o)}
                  className={SELECT_CLS + " flex items-center gap-2 justify-between"}
                  style={{ minWidth: `${minWidth}px`, maxWidth: "280px" }}>
            <span className="truncate">{label}</span>
            <svg width="10" height="10" viewBox="0 0 20 20" className="shrink-0"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"/></svg>
          </button>
          {open && (
            <div className={`absolute left-0 mt-2 ${popoverWidth} bg-white border border-[#2B0C55]/10 rounded-lg shadow-xl max-h-72 overflow-y-auto`}
                 style={{ zIndex: 50 }}>
              {options.length === 0 ? (
                <div className="px-3 py-3 text-xs text-slate-400">Nenhuma opção disponível</div>
              ) : options.map(v => {
                const checked = selected.has(v);
                return (
                  <label key={v} className="flex items-center gap-2 px-3 py-2 hover:bg-[#6A52B3]/5 cursor-pointer text-sm">
                    <input type="checkbox" checked={checked} onChange={() => toggle(v)} />
                    <span className="truncate">{display(v)}</span>
                  </label>
                );
              })}
              {selected.size > 0 && (
                <button onClick={() => onChange(new Set())}
                        className="w-full text-left px-3 py-2 text-xs text-slate-500 border-t border-slate-100 hover:bg-slate-50 sticky bottom-0 bg-white">
                  Limpar seleção
                </button>
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [data, setData] = useState(null);
      const [err, setErr] = useState(null);
      const [selectedYears, setSelectedYears] = useState(new Set());
      const [selectedMonths, setSelectedMonths] = useState(new Set());
      const [selectedCriativos, setSelectedCriativos] = useState(new Set());
      const [selectedAnuncios, setSelectedAnuncios] = useState(new Set());

      useEffect(() => {
        fetch("data/data.json?t=" + Date.now())
          .then(r => r.json())
          .then(setData)
          .catch(e => setErr(e.message));
      }, []);

      const chanelLeads = (data && data.midia_paga && data.midia_paga.chanel && data.midia_paga.chanel.leads) || [];

      const months = useMemo(() => {
        const set = new Set();
        for (const l of chanelLeads) {
          const k = leadMonthKey(l.data);
          if (k) set.add(k);
        }
        return [...set].sort().reverse();
      }, [chanelLeads]);

      // Inicializa filtro no ano + mês mais recente assim que os dados chegam
      useEffect(() => {
        if (selectedYears.size === 0 && months.length) {
          const [y, mm] = months[0].split("-");
          setSelectedYears(new Set([y]));
          setSelectedMonths(new Set([mm]));
        }
      }, [months]);

      // Cada lista de opções é calculada a partir dos leads filtrados pelos *outros* filtros.
      // Isso torna os dropdowns cascateados: filtrar por mês reduz criativos/anúncios disponíveis.
      const leadsForYears = useMemo(
        () => applyFilters(chanelLeads, { months: selectedMonths, criativos: selectedCriativos, anuncios: selectedAnuncios }),
        [chanelLeads, selectedMonths, selectedCriativos, selectedAnuncios]
      );
      const leadsForMonths = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, criativos: selectedCriativos, anuncios: selectedAnuncios }),
        [chanelLeads, selectedYears, selectedCriativos, selectedAnuncios]
      );
      const leadsForCriativos = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, months: selectedMonths, anuncios: selectedAnuncios }),
        [chanelLeads, selectedYears, selectedMonths, selectedAnuncios]
      );
      const leadsForAnuncios = useMemo(
        () => applyFilters(chanelLeads, { years: selectedYears, months: selectedMonths, criativos: selectedCriativos }),
        [chanelLeads, selectedYears, selectedMonths, selectedCriativos]
      );

      // Inclui sempre o que está selecionado (mesmo se filtrar pra zero), para a usuária conseguir desmarcar.
      const unionSorted = (arr, selectedSet, cmp) => {
        const set = new Set([...arr, ...selectedSet]);
        return [...set].filter(Boolean).sort(cmp);
      };

      const availableYears = useMemo(() => {
        const s = new Set();
        for (const l of leadsForYears) { const k = leadMonthKey(l.data); if (k) s.add(k.split("-")[0]); }
        return unionSorted([...s], selectedYears, (a, b) => b.localeCompare(a));
      }, [leadsForYears, selectedYears]);

      const availableMonthNums = useMemo(() => {
        const s = new Set();
        for (const l of leadsForMonths) { const k = leadMonthKey(l.data); if (k) s.add(k.split("-")[1]); }
        return unionSorted([...s], selectedMonths, (a, b) => a.localeCompare(b));
      }, [leadsForMonths, selectedMonths]);

      const availableCriativos = useMemo(() => {
        const s = new Set();
        for (const l of leadsForCriativos) { if (l.criativo) s.add(l.criativo); }
        return unionSorted([...s], selectedCriativos, (a, b) => a.localeCompare(b, "pt-BR"));
      }, [leadsForCriativos, selectedCriativos]);

      const availableAnuncios = useMemo(() => {
        const s = new Set();
        for (const l of leadsForAnuncios) { if (l.anuncio) s.add(l.anuncio); }
        return unionSorted([...s], selectedAnuncios, (a, b) => a.localeCompare(b, "pt-BR"));
      }, [leadsForAnuncios, selectedAnuncios]);

      const m = useMemo(() => {
        if (!chanelLeads.length) return null;
        return aggregate(applyFilters(chanelLeads, {
          years: selectedYears, months: selectedMonths,
          criativos: selectedCriativos, anuncios: selectedAnuncios,
        }));
      }, [chanelLeads, selectedYears, selectedMonths, selectedCriativos, selectedAnuncios]);

      return (
        <>
          <Header />
          <main className="px-6 lg:px-10 py-8 max-w-6xl mx-auto space-y-6">
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div>
                <h1 className="text-xl font-semibold">Mídia Paga</h1>
                <p className="text-sm text-slate-500">Performance dos criativos sobre os leads gerados.</p>
              </div>
              {data && (
                <div className="text-xs text-slate-500">
                  Atualizado em {new Date(data.generated_at).toLocaleString("pt-BR")} · fonte: {data.sheet_tab}
                </div>
              )}
            </div>

            {data && months.length > 0 && (
              <div className="card px-5 py-4 flex items-center justify-between flex-wrap gap-3 relative" style={{ zIndex: 30 }}>
                <div className="flex items-center flex-wrap gap-3">
                  <MultiSelectDropdown
                    allLabel="Todos os meses"
                    pluralLabel="meses selecionados"
                    options={availableMonthNums}
                    selected={selectedMonths}
                    onChange={setSelectedMonths}
                    displayFn={(mm) => MESES_LONG[+mm - 1]}
                    minWidth={170}
                    popoverWidth="w-56"
                  />
                  <MultiSelectDropdown
                    allLabel="Todos os anos"
                    pluralLabel="anos selecionados"
                    options={availableYears}
                    selected={selectedYears}
                    onChange={setSelectedYears}
                    minWidth={140}
                    popoverWidth="w-40"
                  />
                  <MultiSelectDropdown
                    allLabel="Todos os criativos"
                    pluralLabel="criativos selecionados"
                    options={availableCriativos}
                    selected={selectedCriativos}
                    onChange={setSelectedCriativos}
                    minWidth={220}
                    popoverWidth="w-80"
                  />
                  <MultiSelectDropdown
                    allLabel="Todos os anúncios"
                    pluralLabel="anúncios selecionados"
                    options={availableAnuncios}
                    selected={selectedAnuncios}
                    onChange={setSelectedAnuncios}
                    minWidth={220}
                    popoverWidth="w-80"
                  />
                </div>
                {(selectedYears.size > 0 || selectedMonths.size > 0 || selectedCriativos.size > 0 || selectedAnuncios.size > 0) && (
                  <button onClick={() => {
                            setSelectedYears(new Set());
                            setSelectedMonths(new Set());
                            setSelectedCriativos(new Set());
                            setSelectedAnuncios(new Set());
                          }}
                          className="text-xs text-slate-600 underline-offset-2 hover:underline">
                    Limpar filtros
                  </button>
                )}
              </div>
            )}

            {err && (
              <div className="card p-5 text-sm text-rose-700 border-rose-200">Erro ao carregar dados: {err}</div>
            )}

            {!data && !err && (
              <div className="card p-10 text-center text-slate-400 text-sm">Carregando…</div>
            )}

            {m && (
              <>
                <section className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <HighlightKpi label="Leads" value={fmtNumber(m.total)} sub="Origem Mídia Paga" />
                  <KpiCard label="SQL" value={fmtNumber(m.total_sql)} sub="Pro · Starter · Qualificado" accent />
                  <KpiCard label="Taxa SQL" value={fmtPct(m.sql_pct)} sub="SQL ÷ Leads" accent />
                </section>

                <section className="card">
                  <div className="px-6 py-4 border-b border-[#2B0C55]/8 flex items-center justify-between">
                    <div>
                      <h2 className="text-base font-semibold">Taxa de SQL por criativo</h2>
                      <p className="text-xs text-slate-500">
                        Quantos leads cada criativo gerou e quantos viraram SQL.
                      </p>
                    </div>
                    <span className="text-xs text-slate-500">{m.criativos.length} criativo(s)</span>
                  </div>
                  <CriativosTable rows={m.criativos} />
                  {m.sem_criativo > 0 && (
                    <div className="px-6 py-3 border-t border-amber-200/60 bg-amber-50/70 text-xs text-amber-800 rounded-b-2xl">
                      ⚠️ <strong>{fmtNumber(m.sem_criativo)} leads ({fmtPct(m.pct_sem_criativo)})</strong> dessa origem não têm criativo preenchido na planilha — esses ficam fora da tabela acima.
                    </div>
                  )}
                </section>
              </>
            )}
          </main>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
